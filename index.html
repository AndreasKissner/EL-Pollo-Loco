<!DOCTYPE html>
<html translate="no">

<head>
  <meta charset="UTF-8" />
  <meta http-equiv="X-UA-Compatible" content="IE=edge" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>El Pollo Loco</title>
  <link rel="icon" type="img/png" href="./img/favicon.png" />
  <link rel="stylesheet" href="./style.css?v=1.3" />
  <link rel="stylesheet" href="./styles/start-menue.css?v=1.2" />
  <link rel="stylesheet" href="./styles/cutscene.css?v=1.2" />
  <link rel="stylesheet" href="./styles/mediaqueries.css" />
</head>

<body>
  <div class="impressum-link">
    <a href="./html/impressum.html"><span class="impressum-none">Impressum</span></a>
       <div class="hud-top-right">
        <button id="hud-sound" onclick="toggleSound()" class="hud-btn" tabindex="-1">
          <img id="sound-icon" src="img/volume_on.png" />
        </button>
        <button id="hud-keyboard" class="hud-btn" onclick="toggleKeyboardInfo()">
          <img src="img/key_space.png" />
        </button>
        <button onclick="toggleFullscreen(document.documentElement)" class="fullscreen-btn">
          <img class="bigscreen-img" src="./img/bigscreen.png" alt="" />
        </button>

        <button onclick="backToStart()" class="fullscreen-btn">
          <img class="bigscreen-img" src="./img/home.png" alt="" />
        </button>
      </div>
  </div>

  <div id="rotate-overlay">
    <div class="rotate-box">
      <img src="./img/rotate.png" width="200px" alt="" />
      <p>Bitte drehe dein Handy ins Querformat.</p>
    </div>
  </div>

  <div id="start-screen" class="start-screen">
    <div id="startMenu" class="start-menu">
      <img src="img/9_intro_outro_screens/start/startscreen_1.png" id="startImage" class="start-image"
        alt="Startscreen" />
      <button onclick="startGame()" class="start-btn">PLAY</button>
    </div>
  </div>

  <div id="game-container">
    <div id="game-hud">
   

      <div id="keyboardInstructions" class="keyboard-info hidden">
        <div class="instruction-row">
          <img src="img/arrow_left.png" />
          <span>run left</span>
        </div>
        <div class="instruction-row">
          <img src="img/arrow_right.png" />
          <span>run right</span>
        </div>
        <div class="instruction-row">
          <img src="img/key_jump.png" />
          <span>jump</span>
        </div>
        <div class="instruction-row">
          <img src="img/key_d.png" />
          <span>throw bottle</span>
        </div>
          <div class="instruction-row">
          <img src="img/home.png" />
          <span>Go To Home</span>
        </div>
          <div class="instruction-row">
          <img src="img/bigscreen.png" />
          <span>Bigscreen</span>
        </div>
        
      </div>

      <div class="hud-bottom-left">
        <button class="hud-move-btn" id="btn-left">
          <img src="./img/arrow_left.png" alt="" />
        </button>

        <button class="hud-move-btn" id="btn-right">
          <img src="./img/arrow_right.png" alt="" />
        </button>
      </div>

      <div class="hud-bottom-right">
        <button class="hud-action-btn" id="btn-jump">
          <img src="./img/pepejump.png" alt="Jump" />
        </button>

        <button class="hud-action-btn" id="btn-throw">
          <img src="./img/6_salsa_bottle/salsa_bottle.png" alt="Throw" />
        </button>
      </div>
    </div>

    <div id="cutscene-container">
      <video id="victoryVideo">
        <source src="video/pepe_chicken.mp4" type="video/mp4" />
      </video>
    </div>

    <div id="videoEndMenu" class="cutscene-text d-none">
      <button class="btn-base lose-btn" onclick="backToStart()">
        Back to Menu
      </button>
    </div>

    <div id="winText" class="cutscene-text cutscene-img">
      <img src="./img/You won, you lost/You Win A.png" alt="" />
    </div>

    <div id="laterText" class="cutscene-text">2 HOURS <br />LATER…</div>

    <div id="loseText" class="you-loose d-none">
      <img src="img/You won, you lost/You lost.png" alt="" />
      <button class="btn-base lose-btn" onclick="backToStart()">
        Back to Menu
      </button>
    </div>

    <button onclick="toggleFullscreen(document.getElementById('canvas'))" class="d-none">
      Fullscreen
    </button>

    <div id="fullscreen">
      <canvas id="canvas" width="720" height="480" class="d-none"></canvas>
    </div>
  </div>

  <script src="./models/drawable_object.class.js?v=1.2"></script>
  <script src="./models/movable_object.class.js?v=1.2"></script>
  <script src="./models/video.class.js?v=1.2"></script>
  <script src="./models/floating_text.class.js?v=1.2"></script>
  <script src="./models/character.class.js?v=1.2"></script>
  <script src="./models/chicken.class.js?v=1.2"></script>
  <script src="./models/cloud.class.js?v=1.2"></script>
  <script src="./models/status_bar.class.js?v=1.2"></script>
  <script src="./models/status_bar_bottle.class.js?v=1.2"></script>
  <script src="./models/status_bar_coins.class.js?v=1.2"></script>
  <script src="./models/coins.class.js?v=1.2"></script>
  <script src="./models/bottle.class.js?v=1.2"></script>
  <script src="./models/world.class.js?v=1.2"></script>
  <script src="./models/cutscene-text.class.js?v=1.2"></script>
  <script src="./models/background_object.class.js?v=1.2"></script>
  <script src="./models/keyboard.class.js?v=1.2"></script>
  <script src="./models/endboss.class.js?v=1.2"></script>
  <script src="./models/mini_chicken.class.js?v=1.2"></script>
  <script src="./models/platform.class.js?v=1.2"></script>
  <script src="./models/throwable_object.class.js?v=1.2"></script>
  <script src="./models/soundmanager.class.js?v=1.2"></script>
  <script src="./models/level.class.js?v=1.2"></script>
  <script src="./levels/level1.js?v=1.2"></script>
  <script src="./js/game.js?v=1.2"></script>
  <script src="./script.js?v=1.2"></script>
  <script src="./js/button.js?v=1.2"></script>
</body>

</html>
